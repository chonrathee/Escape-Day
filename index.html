
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เครื่องคำนวณวันหนีราชการ</title>
  <style>
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      font-size: 18px;
      background-color: #ffffff;
    }
    h2 {
      text-align: center;
    }
    label, input, button {
      display: block;
      margin-top: 10px;
      width: 100%;
      font-size: 18px;
    }
    input, button {
      padding: 10px;
      box-sizing: border-box;
    }
    #result {
      margin-top: 20px;
      background-color: #f0f0f0;
      padding: 20px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    @media screen and (max-width: 480px) {
      body { font-size: 16px; padding: 10px; }
      h2 { font-size: 20px; }
      label, input, button { font-size: 16px; }
    }
  </style>
</head>
<body>
  <h2>คำนวณวันหนีราชการ</h2>
  <label for="start">วันที่เริ่มขาดราชการ:</label>
  <input type="date" id="start" />

  <label for="end">วันที่ได้ตัวกลับ (ไม่นับวันนี้):</label>
  <input type="date" id="end" />

  <button onclick="calculateAbsence()">คำนวณ</button>

  <div id="result"></div>

  <script>
    function calculateAbsence() {
      const startInput = document.getElementById("start").value;
      const endInput = document.getElementById("end").value;
      const resultDiv = document.getElementById("result");

      if (!startInput || !endInput) {
        resultDiv.innerText = "กรุณาระบุวันที่ให้ถูกต้อง";
        return;
      }

      const start = new Date(startInput);
      const end = new Date(endInput);

      if (end <= start) {
        resultDiv.innerText = "วันที่ได้ตัวกลับต้องหลังจากวันที่ขาดราชการ";
        return;
      }

      const totalDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));

      let fullYears = 0;
      let yearCursor = new Date(start);
      while (true) {
        const nextYear = new Date(yearCursor);
        nextYear.setFullYear(nextYear.getFullYear() + 1);
        if (nextYear <= end) {
          fullYears++;
          yearCursor = nextYear;
        } else {
          break;
        }
      }

      const remainingDays = Math.floor((end - yearCursor) / (1000 * 60 * 60 * 24));
      let months = 0, days = 0;

      if (remainingDays >= 360 && remainingDays <= 364) {
        months = 12;
        days = 0;
      } else {
        months = Math.floor(remainingDays / 30);
        days = remainingDays % 30;
      }

      const summary = `ผลการคำนวณ:\nขาดราชการเป็นเวลา ${fullYears} ปี ${months} เดือน ${days} วัน\n`;

      const detail = `\nขั้นตอนการคำนวณ:\n` +
        `1. วันที่เริ่มขาดราชการ: ${start.toLocaleDateString('th-TH')}\n` +
        `2. วันที่ได้ตัวกลับ: ${end.toLocaleDateString('th-TH')}\n` +
        `3. จำนวนวันทั้งหมดที่ขาดราชการ: ${totalDays} วัน\n` +
        `4. ตรวจสอบปีเต็มจากวัน/เดือนเดียวกัน: ${fullYears} ปี\n` +
        `5. คำนวณวันคงเหลือหลังหักปีเต็ม: ${remainingDays} วัน\n` +
        (remainingDays >= 360 && remainingDays <= 364 
          ? `6. ปัดเศษ 360–364 วัน = 12 เดือน\n`
          : `6. แปลงเศษวันเป็นเดือน (30 วัน/เดือน): ${months} เดือน ${days} วัน`);

      resultDiv.innerText = summary + detail;

      fetch("https://script.google.com/macros/s/AKfycby-GoJJgXxJWMQVCtunIFOm3EtHOoz6VDBMKc4sdwoJOqRRx5J5Sbs5w6TvC9Z6IUIl4w/exec", {
        method: "POST",
        body: JSON.stringify({
          startDate: startInput,
          endDate: endInput,
          totalDays: totalDays,
          years: fullYears,
          months: months,
          days: days
        }),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then(res => res.json())
      .then(data => console.log("ส่งข้อมูลสำเร็จ:", data))
      .catch(err => console.error("เกิดข้อผิดพลาดในการส่งข้อมูล:", err));
    }
  </script>
</body>
</html>
