<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เครื่องคำนวณวันหนีราชการ</title>
  <style>
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      font-size: 18px;
    }
    label, input, button {
      display: block;
      margin-top: 10px;
      width: 100%;
      font-size: 18px;
    }
    #result {
      margin-top: 20px;
      background-color: #f0f0f0;
      padding: 20px;
      border-radius: 8px;
    }
    #downloadBtn {
      margin-top: 15px;
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>คำนวณวันหนีราชการ</h2>
  <label for="start">วันที่เริ่มขาดราชการ:</label>
  <input type="date" id="start">

  <label for="end">วันที่ได้ตัวกลับ (ไม่นับวันนี้):</label>
  <input type="date" id="end">

  <button onclick="calculateAbsence()">คำนวณ</button>
  <button id="downloadBtn" onclick="downloadPDF()" style="display:none;">ดาวน์โหลดผลลัพธ์เป็น PDF</button>

  <div id="result"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    function calculateAbsence() {
      const startInput = document.getElementById('start').value;
      const endInput = document.getElementById('end').value;
      const resultDiv = document.getElementById('result');
      const downloadBtn = document.getElementById('downloadBtn');

      if (!startInput || !endInput) {
        resultDiv.innerText = 'โปรดกรอกวันที่ให้ครบถ้วน';
        return;
      }

      const start = new Date(startInput);
      const end = new Date(endInput);

      if (end <= start) {
        resultDiv.innerText = 'วันที่กลับต้องหลังจากวันที่เริ่มขาดราชการ';
        return;
      }

      const diffDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));

      let years = 0, months = 0, days = 0;

      const prevDay = new Date(end.getTime() - 86400000);
      const isFullYear = start.getDate() === prevDay.getDate() && start.getMonth() === prevDay.getMonth();

      if (isFullYear) {
        years = end.getFullYear() - start.getFullYear();
        if (end.getMonth() < start.getMonth() || (end.getMonth() === start.getMonth() && end.getDate() <= start.getDate())) {
          years--;
        }
      }

      let remainDays = diffDays - (years * 365);

      if (remainDays >= 360 && remainDays <= 364) {
        months = 12;
        days = 0;
      } else if (remainDays > 0) {
        months = Math.floor(remainDays / 30);
        days = remainDays % 30;
      }

      const detail = `รายละเอียดการคำนวณ:<br>
        - รวมจำนวนวันทั้งหมด: ${diffDays} วัน<br>
        - หักปีเต็ม (${years} × 365 วัน) = ${years * 365} วัน<br>
        - เหลือเศษวัน: ${remainDays} วัน<br>
        - แปลงเศษวันเป็นเดือน (30 วัน/เดือน) = ${months} เดือน ${days} วัน`;

      resultDiv.innerHTML = `<strong>ผลการคำนวณ:</strong><br>
        ขาดราชการเป็นเวลา <strong>${years} ปี ${months} เดือน ${days} วัน</strong><br><br>${detail}`;

      downloadBtn.style.display = 'block';
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const result = document.getElementById('result').innerText;
      const lines = doc.splitTextToSize(result, 180);
      doc.text(lines, 10, 20);
      doc.save('ผลการคำนวณวันหนีราชการ.pdf');
    }
  </script>
</body>
</html>
