<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เครื่องคำนวณวันหนีราชการ</title>
  <style>
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      font-size: 18px;
      background: linear-gradient(to right, #eef2f3, #ffffff);
    }
    h2 {
      text-align: center;
      color: #1f4e79;
      margin-bottom: 30px;
    }
    label {
      font-weight: bold;
      color: #333;
    }
    input, button {
      display: block;
      margin-top: 10px;
      width: 100%;
      font-size: 18px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #1f4e79;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 20px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #163a5f;
    }
    #result {
      margin-top: 30px;
      background-color: #f4fbff;
      padding: 20px;
      border-left: 6px solid #1f4e79;
      border-radius: 8px;
      white-space: pre-wrap;
      color: #1a1a1a;
      line-height: 1.6;
    }
    @media screen and (max-width: 480px) {
      body { font-size: 16px; padding: 10px; }
      h2 { font-size: 20px; }
      label, input, button { font-size: 16px; }
    }
  </style>
</head>
<body>
  <h2>คำนวณวันหนีราชการ</h2>
  <label for="start">วันที่เริ่มขาดราชการ:</label>
  <input type="date" id="start" />

  <label for="end">วันที่ได้ตัวกลับ (ไม่นับวันนี้):</label>
  <input type="date" id="end" />

  <button onclick="calculateAbsence()">คำนวณ</button>

  <div id="result"></div>

  <script>
    function calculateAbsence() {
      const startInput = document.getElementById("start").value;
      const endInput = document.getElementById("end").value;
      const resultDiv = document.getElementById("result");

      if (!startInput || !endInput) {
        resultDiv.innerText = "กรุณาระบุวันที่ให้ถูกต้อง";
        return;
      }

      const start = new Date(startInput);
      const end = new Date(endInput);

      if (end <= start) {
        resultDiv.innerText = "วันที่ได้ตัวกลับต้องหลังจากวันที่ขาดราชการ";
        return;
      }

      const totalDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));

      let fullYears = 0;
      let yearCursor = new Date(start);
      while (true) {
        const nextYear = new Date(yearCursor);
        nextYear.setFullYear(nextYear.getFullYear() + 1);
        if (nextYear <= end) {
          fullYears++;
          yearCursor = nextYear;
        } else {
          break;
        }
      }

      const remainingDays = Math.floor((end - yearCursor) / (1000 * 60 * 60 * 24));
      let months = 0, days = 0;

      if (remainingDays >= 360 && remainingDays <= 364) {
        months = 12;
        days = 0;
      } else {
        months = Math.floor(remainingDays / 30);
        days = remainingDays % 30;
      }

      const summary = `ผลการคำนวณ:
ขาดราชการเป็นเวลา ${fullYears} ปี ${months} เดือน ${days} วัน
`;

      const detail = `
ขั้นตอนการคำนวณ:
` +
        `1. วันที่เริ่มขาดราชการ: ${start.toLocaleDateString('th-TH')}
` +
        `2. วันที่ได้ตัวกลับ: ${end.toLocaleDateString('th-TH')}
` +
        `3. จำนวนวันทั้งหมดที่ขาดราชการ: ${totalDays} วัน
` +
        `4. ตรวจสอบปีเต็มจากวัน/เดือนเดียวกัน: ${fullYears} ปี
` +
        `5. คำนวณวันคงเหลือหลังหักปีเต็ม: ${remainingDays} วัน
` +
        (remainingDays >= 360 && remainingDays <= 364 
          ? `6. ปัดเศษ 360–364 วัน = 12 เดือน
`
          : `6. แปลงเศษวันเป็นเดือน (30 วัน/เดือน): ${months} เดือน ${days} วัน`);

      resultDiv.innerText = summary + detail;
    }
  </script>
</body>
</html>
